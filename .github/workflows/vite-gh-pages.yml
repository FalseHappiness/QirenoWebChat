# Sample workflow for building and deploying Vite site to GitHub Pages
name: Deploy Vite Project to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制，避免多次发布冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies & Build Vite
        working-directory: ./viewer
        env:
          VITE_BACKEND_DETECTOR: false
          VITE_BASE: /
        run: |
          npm install
          npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 默认打包输出目录 viewer/dist
          path: viewer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5